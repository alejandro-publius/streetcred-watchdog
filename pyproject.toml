[project]
name = "streetcred-watchdog"
version = "0.1.0"
description = "An autonomous agent that watches San Francisco street data and publishes its decisions, declines included."
requires-python = ">=3.11"
# The local loop needs one package. Everything Google is an optional extra
# below, because a dependency you cannot avoid installing is not behind an
# adapter no matter what the architecture diagram says.
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
cloud = [
  "google-adk>=0.1.0",
  "google-cloud-firestore>=2.16.0",
  "google-cloud-pubsub>=2.21.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-genai>=0.3.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
]

[project.scripts]
watchdog = "watchdog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchdog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Chosen for what they catch in this specific codebase rather than for
# completeness. Four of them earn their place outright:
#
#   B905  zip without strict. The sweep zips corners against fetch results, and a
#         short result list would silently drop corners from the sweep with no
#         entry written anywhere. Exactly the invisible failure this repo exists
#         to prevent.
#   DTZ   naive datetimes. Every window boundary in this agent is UTC on purpose,
#         and a naive one would move by an hour twice a year.
#   BLE   blind excepts. Several are deliberate here, and each of those now
#         carries a noqa with the reason, which is the point: the rule turns an
#         invisible habit into a decision somebody wrote down.
#   RUF   catches the unused unpacked variable that hid a real omission.
#
# Formatting is deliberately not enforced. `ruff format` would reflow comment
# blocks that are laid out to be read, and in this repo the comments are half
# the artefact.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "TID",
    "DTZ", "BLE", "ISC", "RUF", "PIE", "ANN204", "PLR0124", "PLR1730",
]
ignore = [
    # Early returns read better than the alternative in the guard-heavy code here.
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately malformed inputs and assert on them.
"tests/*" = ["B015", "RUF059"]
# ledger.py is mostly HTML templates inside triple-quoted f-strings. A noqa
# comment cannot go on a line inside a string literal, and wrapping mid-tag makes
# the generated markup worse to read than the source it came from.
"src/watchdog/ledger.py" = ["E501"]
